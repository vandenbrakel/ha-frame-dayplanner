configuration:
  tv_host:
    name: TV IP address
    description: IP address of the Samsung The Frame (give it a fixed IP in your router).
  tv_port:
    name: TV port
    description: 8002 (secure websocket) works for all recent Frames.
  orientation:
    name: TV orientation
    description: portrait or landscape. Each has its own layout below.
  resolution:
    name: Resolution
    description: 4k is sharpest, 1080p uploads faster.
  matte:
    name: Matte
    description: Frame matte around the image, e.g. none, flexible_polar, shadowbox_polar.
  language:
    name: Language
    description: Language of day/month names and weather labels.
  theme:
    name: Theme
    description: paper (warm), paper-texture (real paper look), kraft (brown paper), chalkboard, white or dark.
  day_background:
    name: Day colour behind day name
    description: Put the colour of today (from week colours) behind the big day name.
  only_in_art_mode:
    name: Only in art mode
    description: Do nothing while someone is watching TV.
  wake_tv:
    name: Wake the TV
    description: "When the planner should show (schedule, event or test) and the TV is off or in standby, switch it on in art mode (Wake-on-LAN, power key, art mode). At most 3 tries per window, so a TV switched off on purpose stays off. Never interrupts someone watching TV."
  tv_mac:
    name: TV MAC address
    description: "For waking a TV that is fully off. Empty = learned automatically while the TV is on (shown in the status). Needs 'Power on with mobile' / 'Wake on LAN' on the TV (Settings > General > Network > Expert settings)."
  restore_previous_art:
    name: Restore previous art
    description: Show the art that was on screen before when the schedule or test ends.
  update_every_minutes:
    name: Update every (minutes)
    description: How often a new frame is pushed. 1 = every minute.
  lead_seconds:
    name: Lead time (seconds)
    description: Minimum seconds to start uploading before the minute changes. Grows automatically when uploads take longer.
  schedule:
    name: Schedule
    description: "When to show the planner. days: mon-fri, sat,sun, daily, ma,wo,vr ... start/end: HH:MM."
  schedule_events:
    name: Also show around events
    description: Events with a start time switch the planner on outside the schedule too, from the prep time before (the time to leave or the start) until the event ends.
  schedule_event_minutes:
    name: Prep time before events
    description: Minutes before the time to leave (or the start) that the planner switches on.
  layout_portrait:
    name: Layout (portrait)
    description: "Columns with a relative width. modules: comma = next row, | = side by side, name:2 = weight. Modules: day, date, clock, time, weather, events, sum, word, week, spacer, line."
  layout_landscape:
    name: Layout (landscape)
    description: Same as portrait layout, used when orientation is landscape.
  clock_style:
    name: Clock style
    description: analog, digital or both.
  clock_minute_numbers:
    name: Clock minute numbers
    description: Show 05, 10, 15 ... around the clock (helps learning to read the clock).
  clock_event_arcs:
    name: Clock event arcs
    description: Show today's timed events as coloured arcs around the clock.
  clock_slots:
    name: Clock time slots (old)
    description: "No longer used: time slots are now events with show: countdown. Existing slots are moved into Events automatically."
  clock_slot_gradient:
    name: Colours show minutes left
    description: "Colour countdown events and 'leave before' lead-ins by the minutes left: green (more than 15), orange (15-10), red (10-5), purple (last 5), blended. Off = use the slot's own colour."
  clock_slot_countdown_minutes:
    name: Countdown starts (minutes)
    description: How many minutes before a countdown event the label shows the countdown ("nog 12 min").
  hidden_enabled:
    name: Hidden figure
    description: Hide a small figure in an empty spot (never on text or tiles), a new spot every day. Can you find it?
  hidden_icons:
    name: Hidden figure icons
    description: Comma-separated icons or emoji (mdi:owl, 🐒); one is picked every day.
  hidden_image:
    name: Own hidden picture
    description: Path to your own PNG (with transparent background) or a folder of pictures, e.g. /share/dayplanner/hidden. Overrides the icons.
  hidden_color:
    name: Hidden figure colour
    description: "Empty = follow the theme (drawn in the theme's ink colour). Or a fixed colour like #e0453a. Emoji and own pictures keep their colours."
  hidden_size:
    name: Hidden figure size (%)
    description: Size as a percentage of the screen width (smaller = harder).
  hidden_count:
    name: Number of hidden figures
    description: How many figures to hide.
  weather_entity:
    name: Weather entity
    description: A weather entity, e.g. weather.forecast_home. Leave empty to hide weather.
  events:
    name: Events
    description: "Repeating or one-time events. when: weekly 'mon' or 'mon,wed' | monthly 'monthly 15' or 'monthly 1st wed' / 'monthly last fri' | yearly '11-20' | once '2026-11-20' | period '2026-12-21..2027-01-04'. Optional icon (mdi:swim, an emoji like 🐒, or a letter / word like A or GYM), start/end (HH:MM), leave_before (minutes: shows a green-to-red 'time to leave' lead-in on the clock), show (list, week, countdown; default 'list,week'; countdown = label below the clock and a band on the minute scale counting down to the end, e.g. Naar school), highlight, color (#hex). Easier: use the Settings tab on the Dayplanner page."
  calendar_entities:
    name: Calendars
    description: Home Assistant calendar entities, e.g. calendar.family.
  calendar_include_words:
    name: Calendar include words
    description: Only show calendar events containing one of these words (empty = all).
  calendar_exclude_words:
    name: Calendar exclude words
    description: Hide calendar events containing one of these words.
  calendar_icon_rules:
    name: Icon rules
    description: "word=icon, e.g. zwem=mdi:swim. Applied to calendar events and holidays."
  holidays_country:
    name: Holidays country
    description: Country code for public holidays (NL, BE, DE, ...). Empty = off.
  holidays_extra:
    name: Extra kid days
    description: Also show Sinterklaas, Sint-Maarten, Moederdag, Vaderdag, Dierendag, Valentijnsdag (NL/BE).
  max_events:
    name: Max events
    description: Maximum number of events shown in the events module.
  week_start:
    name: Week strip starts on
    description: Order of the week strip. monday or sunday first (every tile shows the next occurrence of that day, today highlighted), or today on top.
  week_colors:
    name: Week colours
    description: Seven colours (monday first) for the week strip and the day name.
  sum_operations:
    name: Sum operators
    description: "Any of + - x : separated by commas."
  sum_max:
    name: Sum maximum
    description: "Highest number used/result for + and -; highest factor for x and :."
  sum_terms:
    name: Sum terms
    description: Number of numbers in a sum (2-4), for + and -.
  sum_missing:
    name: Missing number
    description: answer = 3 + 4 = ?, random = sometimes 3 + ? = 7.
  word_patterns:
    name: Word patterns
    description: "Klankzuivere woordstructuur, e.g. mkm or mk,km,mkm,mmkm,mkmm (m = medeklinker, k = klinker)."
  word_max_letters:
    name: Word max letters
    description: Maximum number of letters.
  word_digraphs:
    name: Allow 2-letter sounds
    description: Allow aa, oo, ee, oe, ie, ui, ij, ei, eu, ou, au, ch, ng.
  word_case:
    name: Word case
    description: lower or upper case.
  word_show_sounds:
    name: Show sounds
    description: Also show the word split into sounds (v - i - s).
  word_custom_list:
    name: Custom words
    description: Use your own word list instead of the built-in klankzuivere words.
  puzzle_refresh:
    name: New sum / word
    description: daily, hourly or every session.
